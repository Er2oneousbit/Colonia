# Continuous integration: unit tests, a reproducible build check and the
# browser smoke test, on every push (any branch). Not on pull requests: the
# project does not take them (they are closed, see close-pull-requests.yml).
name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # The smoke test runs the 3D renderer on a software GL: with the animated people and
    # walkers it takes about 13 minutes of the job's 16 (v0.20.25). Room to grow, still a
    # hard limit for a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Simulation tests
        run: npm test

      - name: Build and verify dist/colonia.html is up to date
        run: |
          npm run build
          if ! git diff --quiet -- dist/colonia.html; then
            echo "::error file=dist/colonia.html::dist/colonia.html is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist/colonia.html
            exit 1
          fi

      - name: Install Playwright + Chromium (not a project dependency)
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:e2e
